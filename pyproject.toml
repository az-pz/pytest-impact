[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-impact"
version = "0.1.0"
description = "Fixture- and conftest-aware test impact analysis for pytest -- select only the tests affected by a git diff, no coverage tracing, no database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Ariz Zubair" },
]
keywords = [
    "pytest",
    "testing",
    "test-impact-analysis",
    "fixtures",
    "conftest",
    "ci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/az-pz/pytest-impact"
Repository = "https://github.com/az-pz/pytest-impact"
Issues = "https://github.com/az-pz/pytest-impact/issues"

[project.entry-points.pytest11]
impact = "pytest_impact.plugin"

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_impact"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
